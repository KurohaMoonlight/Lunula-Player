[package]
name = "lunulaplayer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
lofty = "0.25.5"
rfd = "0.17.2"
walkdir = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
