[package]
name = "lunulaplayer"
version = "1.0.0"
edition = "2024"

[dependencies]
stacker = "0.1"
eframe = "0.37.0"
lofty = "0.25.5"
rfd = "0.17.2"
walkdir = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rubato = "5.0.1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
souvlaki = "0.9.3"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true


